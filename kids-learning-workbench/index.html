<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1a0a3e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="description" content="小小冒险家学习台" />
  <title>小小冒险家学习台</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5.0/dist/hanzi-writer.min.js"></script>
</head>
<body>
  <div class="doodle-wall" aria-hidden="true"><div class="doodle-photo"></div><div class="doodle-veil"></div></div>
  <div id="app">
    <header class="header">
      <div class="logo"><span class="logo-badge">🚀</span><span class="logo-text">小小冒险家</span></div>
      <div class="header-right"><span id="stars" class="stars">⭐ 0</span><button id="btn-settings" class="icon-btn">⚙️</button></div>
    </header>
    <section id="dashboard" class="page active">
      <div class="wall-stage">
        <div class="wall-photo" role="img" aria-label="学习涂鸦墙"></div>
        <div class="wall-hud">
          <div class="greeting-mini"><h1 id="greeting-text">早上好，小探险家！</h1><p id="date-text"></p></div>
          <div class="progress-mini"><span class="progress-label">🗺️ 今日</span><div class="progress-bar"><div id="progress-fill" class="progress-fill" style="width:0%"></div></div><span id="progress-text" class="progress-text">0/6</span></div>
        </div>
        <button class="hotspot" data-subject="astro" style="--x:48%;--y:18%;--w:22%;--h:28%;" aria-label="天文"><span class="hot-ring"></span><span class="hot-label">👨‍🚀 天文</span><span class="hot-status" id="status-astro"></span></button>
        <button class="hotspot" data-subject="chinese" style="--x:8%;--y:52%;--w:24%;--h:32%;" aria-label="语文"><span class="hot-ring"></span><span class="hot-label">📚 语文</span><span class="hot-status" id="status-chinese"></span></button>
        <button class="hotspot" data-subject="math" style="--x:38%;--y:42%;--w:28%;--h:30%;" aria-label="数学"><span class="hot-ring"></span><span class="hot-label">🔢 数学</span><span class="hot-status" id="status-math"></span></button>
        <button class="hotspot" data-subject="geo" style="--x:68%;--y:22%;--w:28%;--h:40%;" aria-label="地理"><span class="hot-ring"></span><span class="hot-label">🏯 地理</span><span class="hot-status" id="status-geo"></span></button>
        <button class="hotspot" data-subject="english" style="--x:18%;--y:28%;--w:18%;--h:22%;" aria-label="英语"><span class="hot-ring"></span><span class="hot-label">✏️ 英语</span><span class="hot-status" id="status-english"></span></button>
        <button class="hotspot" data-subject="games" style="--x:72%;--y:68%;--w:20%;--h:22%;" aria-label="游戏"><span class="hot-ring"></span><span class="hot-label">🧭 游戏</span><span class="hot-status" id="status-games"></span></button>
        <p class="wall-hint">👆 点墙上的书本、数字、宇航员、长城… 开始探险</p>
      </div>
    </section>
    <section id="subject-page" class="page">
      <div class="subject-header"><button id="btn-back" class="back-btn">← 回墙</button><h2 id="subject-title"></h2></div>
      <div id="subject-content" class="subject-content sticker"></div>
    </section>
    <div id="settings-modal" class="modal hidden">
      <div class="modal-content sticker">
        <h3>⚙️ 探险设置</h3>
        <label><input type="checkbox" id="sound-toggle" checked /> 🔊 开启声音</label>
        <label><input type="checkbox" id="anim-toggle" checked /> ✨ 开启动画</label>
        <label><input type="checkbox" id="ai-toggle" checked /> 🤖 开启 AI 老师</label>
        <button id="btn-test-ai" class="secondary-btn" style="width:100%;margin:4px 0;">测试 AI 连接</button>
        <p id="ai-test-result" style="font-size:0.9rem;text-align:center;min-height:1.2em;"></p>
        <button id="btn-reset" class="danger-btn">清空今日进度</button>
        <button id="btn-close-settings" class="primary-btn">出发！</button>
      </div>
    </div>
  </div>
  <script src="js/config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/store.js"></script>
  <script src="js/tts.js"></script>
  <script src="js/games.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
